# sonar-project.properties - put this at repository root

sonar.projectKey=AsharAli-042_ashar-rizvi-mern-10pshine
sonar.organization=ashar-ali-rizvi

# Which source folders to analyze
sonar.sources=backend/src,frontend/src

# Where tests live (IMPORTANT: exclude from sources!)
sonar.tests=backend/test,frontend/src/__tests__

# Test file patterns (helps Sonar identify test files)
sonar.test.inclusions=**/*.test.js,**/*.test.jsx,**/*.spec.js,**/*.spec.jsx

# Exclude common directories and test files from source analysis
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.test.js,**/*.test.jsx,**/*.spec.js,**/*.spec.jsx

# Coverage reports (LCOV)
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info